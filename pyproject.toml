[project]
name = "cogformer"
version = "0.1.0"
description = "Generalized framework for multi-model amortized Bayesian inference"
authors = [
    { name = "Jerry Huang", email = "aca.jerryh@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "bayesflow>=2.0.2",
    "matplotlib>=3.10",
    "numba>=0.64",
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.8",
    "scipy>=1.17",
    "seaborn>=0.13",
    "torch>=2.11",
    "tqdm>=4.67",
    "wandb>=0.25",
]

[project.optional-dependencies]
test = [
    "pytest>=8.3.5",
]
dev = [
    "jupyter>=1.1.1",
    "jupyterlab>=4.4.1",
    "ruff>=0.11.7",
]

[tool.ruff.lint.per-file-ignores]
# __init__.py files re-export the package's public API; unused-import is expected.
"__init__.py" = ["F401"]
